<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">MercLink</title>
  <desc id="d">MercLink：在 AI 时代，让天下没有难做的生意。一家店，一套 HTTP API，商家、买家与店面 Agent 通过三份 Skill 直接对接。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1022"/>
      <stop offset="0.55" stop-color="#0E1A36"/>
      <stop offset="1" stop-color="#101B3B"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="0.12" cy="0.1" r="0.45">
      <stop offset="0" stop-color="#E8B04B" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E8B04B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="linkText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6D38B"/>
      <stop offset="1" stop-color="#C98E2B"/>
    </linearGradient>
    <linearGradient id="thumb1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="thumb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="thumb3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#99F6E4"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect width="1280" height="400" fill="url(#glowBlue)"/>
  <rect width="1280" height="400" fill="url(#glowGold)"/>

  <g font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','Source Han Sans SC',system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">

    <!-- logo mark -->
    <g transform="translate(80 78)">
      <rect width="56" height="56" rx="14" fill="url(#brand)"/>
      <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round">
        <rect x="9" y="20" width="24" height="16" rx="8"/>
        <rect x="23" y="20" width="24" height="16" rx="8" stroke-opacity="0.85"/>
      </g>
    </g>
    <text x="150" y="116" font-size="15" letter-spacing="4" fill="#94A3B8" font-weight="600">AGENT-NATIVE COMMERCE</text>

    <!-- wordmark -->
    <text x="76" y="212" font-size="80" font-weight="800" letter-spacing="-2" fill="#F8FAFC">Merc<tspan fill="url(#linkText)">Link</tspan></text>

    <!-- tagline -->
    <text x="80" y="262" font-size="28" font-weight="600" fill="#E2E8F0">在 AI 时代，让天下没有难做的生意</text>
    <text x="80" y="298" font-size="17" fill="#94A3B8">一家店 · 一套 HTTP API · 让各种 Agent 直接找到商品、完成购买</text>

    <!-- chips -->
    <g font-size="13" font-weight="600">
      <g transform="translate(80 322)">
        <rect width="128" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <circle cx="16" cy="15" r="4" fill="#38BDF8"/>
        <text x="28" y="20" fill="#CBD5E1">OAuth 设备码</text>
      </g>
      <g transform="translate(218 322)">
        <rect width="104" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <circle cx="16" cy="15" r="4" fill="#A5B4FC"/>
        <text x="28" y="20" fill="#CBD5E1">/llms.txt</text>
      </g>
      <g transform="translate(332 322)">
        <rect width="124" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <circle cx="16" cy="15" r="4" fill="#F6D38B"/>
        <text x="28" y="20" fill="#CBD5E1">可替换店面</text>
      </g>
      <g transform="translate(466 322)">
        <rect width="142" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <circle cx="16" cy="15" r="4" fill="#34D399"/>
        <text x="28" y="20" fill="#CBD5E1">Docker 一键部署</text>
      </g>
    </g>

    <!-- connectors -->
    <g fill="none" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round">
      <path d="M884 98 C 920 98, 920 150, 958 150" stroke="#38BDF8" stroke-opacity="0.8"/>
      <path d="M884 200 C 920 200, 920 205, 958 205" stroke="#A5B4FC" stroke-opacity="0.8"/>
      <path d="M884 302 C 920 302, 920 262, 958 262" stroke="#F6D38B" stroke-opacity="0.8"/>
    </g>
    <g>
      <circle cx="958" cy="150" r="4" fill="#38BDF8"/>
      <circle cx="958" cy="205" r="4" fill="#A5B4FC"/>
      <circle cx="958" cy="262" r="4" fill="#F6D38B"/>
    </g>

    <!-- agent pills -->
    <g filter="url(#shadow)">
      <g transform="translate(680 66)">
        <rect width="204" height="64" rx="16" fill="#0F1B3A" stroke="#38BDF8" stroke-opacity="0.45"/>
        <circle cx="32" cy="32" r="17" fill="#38BDF8" fill-opacity="0.16"/>
        <path d="M23 38 L23 28 L32 23 L41 28 L41 38 Z M29 38 L29 32 L35 32 L35 38" fill="none" stroke="#7DD3FC" stroke-width="2" stroke-linejoin="round"/>
        <text x="60" y="29" font-size="16" font-weight="700" fill="#F1F5F9">商家 Agent</text>
        <text x="60" y="48" font-size="12" fill="#7DD3FC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">/merchant/skill.md</text>
      </g>
      <g transform="translate(680 168)">
        <rect width="204" height="64" rx="16" fill="#0F1B3A" stroke="#A5B4FC" stroke-opacity="0.45"/>
        <circle cx="32" cy="32" r="17" fill="#A5B4FC" fill-opacity="0.16"/>
        <path d="M23 26 L26 26 L29 37 L39 37 L41 29 L27.5 29" fill="none" stroke="#C7D2FE" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="30" cy="41" r="1.8" fill="#C7D2FE"/>
        <circle cx="38" cy="41" r="1.8" fill="#C7D2FE"/>
        <text x="60" y="29" font-size="16" font-weight="700" fill="#F1F5F9">买家 Agent</text>
        <text x="60" y="48" font-size="12" fill="#C7D2FE" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">/skill.md</text>
      </g>
      <g transform="translate(680 270)">
        <rect width="204" height="64" rx="16" fill="#0F1B3A" stroke="#F6D38B" stroke-opacity="0.45"/>
        <circle cx="32" cy="32" r="17" fill="#F6D38B" fill-opacity="0.16"/>
        <path d="M22 26 h20 v14 h-20 Z M22 30 h20" fill="none" stroke="#F6D38B" stroke-width="2" stroke-linejoin="round"/>
        <text x="60" y="29" font-size="16" font-weight="700" fill="#F1F5F9">店面 Agent</text>
        <text x="60" y="48" font-size="12" fill="#F6D38B" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Noto Sans Mono CJK SC',monospace">/storefront/skill.md</text>
      </g>
    </g>

    <!-- store card -->
    <g filter="url(#shadow)">
      <g transform="translate(966 62)">
        <rect width="250" height="276" rx="18" fill="#F8FAFC"/>
        <path d="M0 18 a18 18 0 0 1 18 -18 h214 a18 18 0 0 1 18 18 v26 h-250 Z" fill="#E2E8F0"/>
        <circle cx="20" cy="22" r="4.5" fill="#F87171"/>
        <circle cx="35" cy="22" r="4.5" fill="#FBBF24"/>
        <circle cx="50" cy="22" r="4.5" fill="#34D399"/>
        <text x="232" y="27" font-size="11" fill="#64748B" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">/api/v1/products</text>

        <!-- rows -->
        <g transform="translate(16 60)">
          <rect width="40" height="40" rx="9" fill="url(#thumb1)"/>
          <circle cx="20" cy="20" r="9" fill="#FFFFFF" fill-opacity="0.85"/>
          <rect x="52" y="7" width="96" height="9" rx="4.5" fill="#1E293B"/>
          <rect x="52" y="24" width="64" height="7" rx="3.5" fill="#CBD5E1"/>
          <rect x="164" y="9" width="54" height="22" rx="11" fill="#0F172A"/>
          <text x="191" y="24.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">¥158</text>
        </g>
        <g transform="translate(16 114)">
          <rect width="40" height="40" rx="9" fill="url(#thumb2)"/>
          <rect x="52" y="7" width="110" height="9" rx="4.5" fill="#1E293B"/>
          <rect x="52" y="24" width="52" height="7" rx="3.5" fill="#CBD5E1"/>
          <rect x="164" y="9" width="54" height="22" rx="11" fill="#0F172A"/>
          <text x="191" y="24.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">¥308</text>
        </g>
        <g transform="translate(16 168)">
          <rect width="40" height="40" rx="9" fill="url(#thumb3)"/>
          <rect x="52" y="7" width="84" height="9" rx="4.5" fill="#1E293B"/>
          <rect x="52" y="24" width="70" height="7" rx="3.5" fill="#CBD5E1"/>
          <rect x="164" y="9" width="54" height="22" rx="11" fill="#0F172A"/>
          <text x="191" y="24.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">¥599</text>
        </g>

        <line x1="16" y1="224" x2="234" y2="224" stroke="#E2E8F0"/>
        <g transform="translate(16 236)">
          <rect width="96" height="26" rx="13" fill="#DCFCE7"/>
          <path d="M14 13 l4 4 l8 -8" fill="none" stroke="#16A34A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="34" y="17.5" font-size="12" font-weight="700" fill="#166534" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">paid</text>
          <text x="218" y="17.5" font-size="12" fill="#64748B" text-anchor="end">订单已支付</text>
        </g>
      </g>
    </g>
  </g>
</svg>
