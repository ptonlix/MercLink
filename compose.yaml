name: merclink

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: merclink
      POSTGRES_PASSWORD: merclink
      POSTGRES_DB: merclink
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merclink -d merclink"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
