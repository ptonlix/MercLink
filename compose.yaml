# 正式环境。在部署机 .env 设置 MERCLINK_IMAGE 为已发布的版本号镜像后执行：
# docker compose pull && docker compose up -d
# 这条命令只拉镜像，不在部署机编译应用。不要加 --build。
# 本地没有远程镜像时才用：docker compose -f compose.yaml -f compose.build.yaml up -d --build
# latest 会被新的正式版覆盖。生产回滚改回版本号标签再 pull，不要假定 latest 可逆。
# Compose 用项目目录的 .env 做变量替换；应用容器也读取同一份 .env。
# 不要把真实密码写进这个文件。POSTGRES_PASSWORD、REDIS_PASSWORD、RUSTFS_SECRET_KEY
# 使用 URL 安全字符。
# 数据库、Redis、对象存储只在 compose 网络内，并使用下面的固定镜像，不打进应用镜像。
# 对象存储是单盘 rustfs/rustfs:1.0.1。控制台端口 9001 不发布。不要把旧 minio_data 卷挂给 rustfs。
# 应用对外端口默认 3000。
# 公网 HTTPS 由部署机上的反向代理提供。APP_BASE_URL 必须是该公网地址。
# 买入默认关闭。需要下单时设置 MERCLINK_PURCHASE=1，这时 ALIPAY_NOTIFY_URL 或易支付通知地址才必须是该公网地址。
# 应用容器固定 NODE_ENV=production，并清空 MERCLINK_DEV_STUBS，避免部署 .env 打开本地模拟。
name: merclink

services:
  app:
    image: ${MERCLINK_IMAGE:-merclink:local}
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      MERCLINK_DEV_STUBS: ""
      DATABASE_URL: postgres://merclink:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/merclink
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      OBJECT_STORAGE_ENDPOINT: http://rustfs:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-merclink}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: merclink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: merclink
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merclink -d merclink"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:8.10.2
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # 命名卷默认属于 root。RustFS 以 10001:10001 运行，启动前先交给这个用户。
  rustfs-volume:
    image: rustfs/rustfs:1.0.1
    user: "0:0"
    entrypoint: ["chown", "10001:10001", "/data"]
    volumes:
      - rustfs_data:/data
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.1
    user: "10001:10001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    depends_on:
      rustfs-volume:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  rustfs-init:
    image: amazon/aws-cli:2.27.49
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-merclink}
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      [
        "/bin/sh",
        "-c",
        'aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$OBJECT_STORAGE_BUCKET" || aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$OBJECT_STORAGE_BUCKET"',
      ]
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
