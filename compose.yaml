name: merclink

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: merclink
      POSTGRES_PASSWORD: merclink
      POSTGRES_DB: merclink
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merclink -d merclink"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: merclink
      MINIO_ROOT_PASSWORD: merclinkminio
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://minio:9000 merclink merclinkminio && mc mb --ignore-existing local/merclink",
      ]
    restart: "no"
